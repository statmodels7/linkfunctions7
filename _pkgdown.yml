url: https://statmodels7.github.io/linkfunctions7

template:
  bootstrap: 5
  bslib:
    primary: "#0F2A3F"
    base_font: {google: "Inter"}
    heading_font: {google: "Inter"}
    code_font: {google: "JetBrains Mono"}

home:
  title: Link functions as reusable objects
  description: >
    Link functions written once, as objects that any package can use, each
    with exact derivatives to fifth order in both directions and a diagnostic
    that verifies them against numerical ones.

navbar:
  structure:
    left:  [intro, reference, articles]
    right: [search, book, statmodels7, github]
  components:
    book:
      text: book
      href: https://statmodels7.github.io/book/
    statmodels7:
      text: statmodels7
      href: https://statmodels7.github.io

reference:
- title: The link class
  desc: >
    The S7 class from which every link inherits, the diagnostic that checks a
    link, and the report of which derivative orders a link computes exactly.
  contents:
  - link
  - check_link
  - link_fallback_orders

- title: Link functions
  desc: >
    Each constructor returns a link object. Those taking arguments cover a
    family: a power, a softplus scale, a bounded interval.
  contents:
  - identity_link
  - log_link
  - logit_link
  - probit_link
  - cloglog_link
  - loglog_link
  - cauchit_link
  - rhobit_link
  - sqrt_link
  - inverse_link
  - inverse_sq_link
  - power_link
  - softplus_link
  - bounded_link

- title: Evaluating a link
  desc: >
    The two directions, and any derivative order of either. `linkinv()`
    returns a value strictly inside the parameter's domain, so its output can
    be passed back to `linkfun()` or to a density that validates against open
    intervals.
  contents:
  - linkfun
  - linkinv
  - linkderiv
  - linkinvderiv
  - link_bounds_clamp
  - eta_bounds

- title: Compiled entry points
  desc: >
    The address of a link in the scalar C entry points, which other packages
    resolve with `R_GetCCallable()`.
  contents:
  - link_scalar_route

- title: Derivatives by order
  desc: >
    The order-specific generics. `linkderiv()` and `linkinvderiv()` route to
    these; call them directly where the extra dispatch matters.
  contents:
  - dlinkfun
  - d2linkfun
  - d3linkfun
  - d4linkfun
  - d5linkfun
  - dlinkinv
  - d2linkinv
  - d3linkinv
  - d4linkinv
  - d5linkinv

- title: Methods
  contents:
  - has_keyword("internal")
  - starts_with("print.")
  - starts_with("plot.")
